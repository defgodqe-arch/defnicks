name: Build defnicks

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build plugin
        run: mvn --batch-mode clean package

      - name: Publish JAR into repository
        shell: bash
        run: |
          mkdir -p dist
          cp target/defnicks-1.1.0.jar dist/defnicks-1.1.0.jar
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/defnicks-1.1.0.jar
          if git diff --cached --quiet; then
            echo "JAR is already up to date."
          else
            git commit -m "Build defnicks 1.1.0 [skip ci]"
            git push
          fi

      - name: Upload plugin JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: defnicks-1.1.0
          path: target/defnicks-1.1.0.jar
          if-no-files-found: error
